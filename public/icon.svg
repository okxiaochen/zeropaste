<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A padlock, served as a static asset.

    Its absence was not cosmetic: with no icon, every browser's /favicon.ico request reached the
    worker and rendered a Next.js 404, measured at 285 ms of CPU — the single most expensive request
    in production. As a static asset it costs nothing and does not count against the Workers quota.
  -->
  <rect width="32" height="32" rx="7" fill="#2f6feb" />
  <path
    d="M11 14.5v-2.2a5 5 0 0 1 10 0v2.2"
    fill="none"
    stroke="#fff"
    stroke-width="2.4"
    stroke-linecap="round"
  />
  <rect x="8.5" y="14.5" width="15" height="10.5" rx="2.5" fill="#fff" />
  <circle cx="16" cy="19.75" r="1.9" fill="#2f6feb" />
</svg>
