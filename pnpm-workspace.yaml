# pnpm 11 blocks package lifecycle scripts unless listed here.
# All five ship platform-specific binaries that their install scripts put in place: Prisma's query
# engines, esbuild's compiler, and sharp's image codecs.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  # workerd is the Cloudflare Workers runtime, used by `wrangler dev` and the local Miniflare tests.
  workerd: true
