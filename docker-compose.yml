# The self-hosted deployment: one service, one volume, no database.
#
# Storage is the filesystem backend, which overwrites a paste's bytes before unlinking it. That is a
# stronger erasure guarantee than any SQL option offers — see src/lib/store/filesystem.ts.
#
# This container speaks plain HTTP by design. TLS must be terminated in front of it, because browsers
# withhold WebCrypto from insecure contexts. See docs/AGENT-DEPLOY.md.

services:
  app:
    build: .
    image: zeropaste:local
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    volumes:
      # Every paste lives here. Without this volume they vanish on restart.
      - zeropaste-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "docker/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  zeropaste-data:
